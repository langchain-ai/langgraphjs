name: Browser CDN smoke test

# This checks a published release against an external CDN, so run it explicitly
# when updating the example rather than making PR unit tests depend on the CDN.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22.23.4"
          cache: pnpm
      - run: pnpm --filter @examples/browser-cdn install --frozen-lockfile
      - run: pnpm --filter @examples/browser-cdn exec playwright install --with-deps chromium
      - run: pnpm --filter @examples/browser-cdn test:cdn
